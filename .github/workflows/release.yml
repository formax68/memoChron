name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write          # required by attest-build-provenance to mint OIDC token
      attestations: write      # required by attest-build-provenance to persist attestation
      artifact-metadata: write # required by v3+ for artifact metadata storage records
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        # Signed provenance builds must not restore dependency caches written by other workflow runs.
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      # DOC-01: a failing lint stops the job here; build, attestation and release are skipped.
      - name: Lint
        run: npm run lint

      - name: Build plugin
        run: npm run build

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Hyphenated tags publish as non-draft prereleases for BRAT; plain semver tags create drafts published by hand.
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          case "$tag" in
            *-*)
              gh release create "$tag" \
                --title="$tag" \
                --prerelease \
                main.js manifest.json styles.css
              ;;
            *)
              gh release create "$tag" \
                --title="$tag" \
                --draft \
                main.js manifest.json styles.css
              ;;
          esac
